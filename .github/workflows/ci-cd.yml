name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to production after tests and image builds pass'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ── Backend Tests ──────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: trading_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Install dependencies
        run: |
          cd backend
          go mod download
          go mod verify

      - name: Check go.mod/go.sum are tidy
        run: |
          cd backend
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check gofmt
        run: |
          cd backend
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Run vet
        run: |
          cd backend
          go vet ./...

      - name: Run tests
        run: |
          cd backend
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: trading
          DATABASE_PASSWORD: testpassword
          DATABASE_NAME: trading_bot_test
          DATABASE_SSLMODE: disable
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          REDIS_DB: 0
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!

  # ── Frontend: shared CI (lint, typecheck, vitest, build) ──────────────────────
  frontend-test:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: frontend
      node-version: "24" # npm 11; npm 10 crashes resolving vitest 4 in this tree
      require-tests: true
      build-command: NEXT_TELEMETRY_DISABLED=1 npm run build

  # ── Strategy: shared CI (uv.lock, ruff, offline test suites) ──────────────────
  strategy-test:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: strategy
      python-version: "3.11" # Dockerfile: python:3.11-slim
      # Undefined names and syntax errors everywhere; the full rule set on the futures files.
      lint-command: >-
        ruff check . --select E9,F63,F7,F82
        && ruff check app/futures_bot.py app/futures_backtest.py scripts/futures_preflight.py
        scripts/futures_backtest.py tests/test_futures_safety.py tests/test_futures_backtest.py
      format-check: false
      # Full offline suite: exclude only the live API contract file, never touch the network,
      # keep every trading path in dry-run / paper mode. Then the stdlib research tests, and a check
      # that requirements.txt (installed by the Dockerfile) still matches uv.lock.
      test-command: >-
        POLY_DRY_RUN=true BINANCE_TH_USE_TESTNET=true FUTURES_ENABLED=false
        FUTURES_EXECUTION_MODE=paper AWS_EC2_METADATA_DISABLED=true
        python -m pytest tests -q -o addopts= --ignore=tests/test_command_center_contract.py
        --disable-socket --allow-unix-socket
        && (cd research && python tests/futures_backtest_test.py && python tests/walk_forward_test.py
        && python tests/data_test.py && python tests/lake_signal_test.py)
        && uv export --frozen --no-dev --no-emit-project --format requirements-txt -q | diff -u requirements.txt -

  # ── Security: shared scan (gitleaks, Semgrep, OSV-Scanner, Trivy) ─────────────
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  # ── Build Docker Images ────────────────────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, strategy-test, security]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_production && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Backend Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          push: false
          tags: bookfinance-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./frontend
          push: false
          tags: bookfinance-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Strategy Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./strategy
          push: false
          tags: bookfinance-strategy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Production ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/bookfinance
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build
            docker system prune -af --volumes
