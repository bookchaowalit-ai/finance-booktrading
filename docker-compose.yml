services:
  # PostgreSQL + TimescaleDB - Persistent Storage
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: trading-bot-postgres
    ports:
      # Loopback only; other containers use postgres:5432 on the network.
      # Set POSTGRES_BIND=0.0.0.0 to expose it deliberately.
      - "${POSTGRES_BIND:-127.0.0.1}:5434:5432"
    environment:
      - POSTGRES_USER=trading
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_DB=trading_bot
    command: >
      -c log_min_messages=WARNING
      -c log_connections=off
      -c log_disconnections=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-bot-network
    restart: unless-stopped

  # Redis - Message Broker
  redis:
    image: redis:7-alpine
    container_name: trading-bot-redis
    ports:
      # Loopback only (override with REDIS_BIND).
      - "${REDIS_BIND:-127.0.0.1}:6380:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-bot-network
    restart: unless-stopped

  # Backend (Go) - Execution & Data Hub
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-bot-backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      # Loopback by default: the dashboard reaches the API through the
      # frontend rewrite (BACKEND_URL) and the browser WebSocket on
      # localhost:8081. Set BACKEND_BIND=0.0.0.0 to serve other hosts.
      - "${BACKEND_BIND:-127.0.0.1}:8080:8080"  # HTTP API
      - "${BACKEND_BIND:-127.0.0.1}:8081:8081"  # WebSocket
      # gRPC is only for the strategy container (backend:9000).
      - "${GRPC_BIND:-127.0.0.1}:9000:9000"
    environment:
      - SERVER_PORT=8080
      - WS_PORT=8081
      - GRPC_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=0
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=trading
      - DATABASE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DATABASE_NAME=trading_bot
      - DATABASE_SSLMODE=disable
      # Security
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (32+ chars)}
      # Seals dex_wallets private keys; required (32+ chars) when DEX_ENABLED=true.
      - DEX_WALLET_ENCRYPTION_KEY=${DEX_WALLET_ENCRYPTION_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      # Strategy proxy (/strategy-api/*): backend validates the user session and
      # forwards with AUTH_TOKEN; the browser never sees the service token.
      - STRATEGY_URL=${STRATEGY_URL:-http://strategy:8000}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - STRATEGY_PROXY_TIMEOUT=${STRATEGY_PROXY_TIMEOUT:-25s}
      # Admin account (created on first startup)
      - FIRST_ADMIN_EMAIL=${FIRST_ADMIN_EMAIL:-}
      - FIRST_ADMIN_PASSWORD=${FIRST_ADMIN_PASSWORD:-}
      - FIRST_ADMIN_NAME=${FIRST_ADMIN_NAME:-Admin}
      # Self-registration: open unless ENVIRONMENT=production (see .env.example).
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-}
      - REGISTRATION_INVITE_CODE=${REGISTRATION_INVITE_CODE:-}
      # Proxies allowed to set X-Forwarded-For / X-Real-IP (empty = private ranges).
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Exchange Provider Selection
      - EXCHANGE_PROVIDER=${EXCHANGE_PROVIDER:-binance_th}
      # Binance Global API Credentials
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_USE_TESTNET=${BINANCE_USE_TESTNET:-true}
      # Binance Thailand API Credentials
      - BINANCE_TH_API_KEY=${BINANCE_TH_API_KEY:-}
      - BINANCE_TH_API_SECRET=${BINANCE_TH_API_SECRET:-}
      # Bitkub API Credentials
      - BITKUB_API_KEY=${BITKUB_API_KEY:-}
      - BITKUB_API_SECRET=${BITKUB_API_SECRET:-}
      - BITKUB_USE_TESTNET=${BITKUB_USE_TESTNET:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - trading-bot-network
    restart: unless-stopped

  # Strategy Service (Python) - The Brain
  strategy:
    build:
      context: ./strategy
      dockerfile: Dockerfile
    container_name: trading-bot-strategy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      # Loopback only: browsers reach it through the backend /strategy-api proxy.
      - "${STRATEGY_BIND:-127.0.0.1}:8001:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=0
      - GRPC_HOST=backend
      - GRPC_PORT=9000
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # Also the service credential for the backend bot routes (route_access.go).
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost:3001}
      - RSI_PERIOD=14
      - EMA_PERIOD=14
      - RSI_OVERSOLD=30.0
      - RSI_OVERBOUGHT=70.0
      - MIN_SIGNAL_STRENGTH=0.2
      - SYMBOLS=BTCUSDT,ETHUSDT
      # Keep signal/gRPC execution disabled unless explicitly reviewed and enabled.
      # Real spot execution is handled by the guarded Real Grid bot below.
      - SIGNAL_ORDER_EXECUTION_ENABLED=${SIGNAL_ORDER_EXECUTION_ENABLED:-false}
      - REAL_SYMBOLS=${REAL_SYMBOLS:-BTCTHB,ETHTHB,BNBTHB,SOLTHB,XRPTHB}
      - DISABLE_PAPER_BOT=${DISABLE_PAPER_BOT:-true}
      # Leveraged USDⓈ-M Futures — opt-in paper/testnet only; mainnet is refused in code
      - FUTURES_ENABLED=${FUTURES_ENABLED:-false}
      - FUTURES_EXECUTION_MODE=${FUTURES_EXECUTION_MODE:-paper}
      - BINANCE_FUTURES_API_KEY=${BINANCE_FUTURES_API_KEY:-}
      - BINANCE_FUTURES_API_SECRET=${BINANCE_FUTURES_API_SECRET:-}
      - FUTURES_SYMBOLS=${FUTURES_SYMBOLS:-BTCUSDT,ETHUSDT}
      - FUTURES_LEVERAGE=${FUTURES_LEVERAGE:-3}
      - FUTURES_PAPER_BALANCE_USDT=${FUTURES_PAPER_BALANCE_USDT:-1000}
      - FUTURES_RISK_PER_TRADE_PCT=${FUTURES_RISK_PER_TRADE_PCT:-1}
      - FUTURES_MAX_MARGIN_USDT=${FUTURES_MAX_MARGIN_USDT:-25}
      - FUTURES_MAX_NOTIONAL_USDT=${FUTURES_MAX_NOTIONAL_USDT:-75}
      - FUTURES_MAX_TOTAL_NOTIONAL_USDT=${FUTURES_MAX_TOTAL_NOTIONAL_USDT:-150}
      - FUTURES_STOP_LOSS_PCT=${FUTURES_STOP_LOSS_PCT:-2}
      - FUTURES_TAKE_PROFIT_PCT=${FUTURES_TAKE_PROFIT_PCT:-4}
      - FUTURES_MIN_LIQUIDATION_BUFFER_PCT=${FUTURES_MIN_LIQUIDATION_BUFFER_PCT:-10}
      # Composite scoring weights
      - WEIGHT_TREND=0.25
      - WEIGHT_MOMENTUM=0.30
      - WEIGHT_VOLATILITY=0.20
      - WEIGHT_RSI=0.15
      # Indicator parameters
      - EMA_FAST_PERIOD=9
      - EMA_SLOW_PERIOD=21
      - MACD_FAST=12
      - MACD_SLOW=26
      - MACD_SIGNAL=9
      - BB_PERIOD=20
      - BB_STD=2.0
      - ATR_PERIOD=14
      - ADX_PERIOD=14
      - ROC_PERIOD=10
      - STOCH_RSI_PERIOD=14
      - ADX_MIN_TREND=25.0
      - MIN_COMPOSITE_SCORE=0.3
      # Real grid bot config
      - BACKEND_API_BASE=http://backend:8080
      - BINANCE_PRICE_API=https://api.binance.th
      - BINANCE_TH_USE_TESTNET=${BINANCE_TH_USE_TESTNET:-true}
      - EXCHANGE_PROVIDER=${EXCHANGE_PROVIDER:-binance_th}
      # Brain Layer 3: Sentiment Analysis
      - CRYPTOPANIC_AUTH_TOKEN=${CRYPTOPANIC_AUTH_TOKEN:-}
      # Market Intel Notifications (Evidence Loop alerts)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_TRADING_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./docs:/app/docs:ro
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - trading-bot-network
    restart: unless-stopped

  # Frontend (Next.js) - Monitoring Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_STRATEGY_URL=${NEXT_PUBLIC_STRATEGY_URL:-}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8081/ws}
        - BACKEND_URL=${BACKEND_URL:-http://backend:8080}
    container_name: trading-bot-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8080}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8081/ws}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trading-bot-network
    restart: unless-stopped

networks:
  trading-bot-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1280"

volumes:
  redis_data:
  postgres_data:
