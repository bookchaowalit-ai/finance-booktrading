# Reviewed Trivy exceptions. Each entry needs a statement; re-check by 2027-01-17.
misconfigurations:
  - id: DS-0002
    paths:
      - backend/Dockerfile.dev
    statement: >-
      Development-only image for docker-compose.dev.yml: it bind-mounts ./backend and runs
      `go mod tidy && go run`, which needs to write the module cache and go.mod/go.sum.
      It is never built for production (backend/Dockerfile runs as a non-root user).
