[project]
name = "bookfinance-strategy"
version = "0.1.0"
description = "Trading strategy service (paper and live modes) for BookTrading"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.157.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "redis==5.0.1",
    "pandas==2.1.4",
    "numpy==1.26.3",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "httpx>=0.27.0",
    # NumPy 1.26 is pinned above; PyArrow 26 requires NumPy 2 at import time.
    "pyarrow>=15.0.0,<26.0.0",
    "boto3>=1.34.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.9",
    "pytest>=8.0.0",
    "pytest-socket==0.7.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
# An application, not a library: uv manages the environment but does not install this folder as a package.
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # Line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["core", "config", "infrastructure"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: requires the running strategy API and Docker services",
]
